# Production overrides for EC2 deployment
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# Required env vars (set in .env or shell):
#   EC2_PUBLIC_IP - the public IP of the EC2 instance
#   ANTHROPIC_API_KEY - your Anthropic API key
#   POSTGRES_PASSWORD - strong database password
#   SECRET_KEY - strong secret key for JWT signing

services:
  backend:
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-stakeholder_sim}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stakeholder_sim}
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=http://${EC2_PUBLIC_IP}:3002
    command: >
      bash -c "
        echo '--- Running Alembic migrations ---' &&
        alembic upgrade head &&
        echo '--- Running seed script ---' &&
        python -m app.scripts.seed &&
        echo '--- Starting API server ---' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
      "

  frontend:
    environment:
      - NEXT_PUBLIC_API_URL=http://${EC2_PUBLIC_IP}:8000
